<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#night)"/>
  <!-- Warm study glow -->
  <circle cx="220" cy="145" r="145" fill="url(#glow)"/>
  <!-- Desk surface -->
  <rect x="0" y="215" width="400" height="85" fill="#78350F"/>
  <rect x="0" y="215" width="400" height="6" fill="#92400E"/>
  <!-- Lamp base -->
  <ellipse cx="105" cy="222" rx="44" ry="10" fill="#334155"/>
  <rect x="97" y="198" width="16" height="24" rx="4" fill="#475569"/>
  <!-- Articulated arm -->
  <line x1="105" y1="200" x2="145" y2="115" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>
  <line x1="145" y1="115" x2="215" y2="75" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="145" cy="115" r="7" fill="#1E293B" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="215" cy="75" r="6" fill="#1E293B" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Lamp shade -->
  <path d="M210 72 L262 92 L248 135 L186 112 Z" fill="#475569"/>
  <ellipse cx="217" cy="123" rx="32" ry="9" transform="rotate(20 217 123)" fill="#FEF08A"/>
  <!-- Study mug & notebook -->
  <rect x="168" y="195" width="110" height="22" rx="3" fill="#F8FAFC"/>
  <rect x="295" y="182" width="34" height="34" rx="6" fill="#2563EB"/>
  <path d="M329 190 C340 190 340 208 329 208" stroke="#2563EB" stroke-width="4" fill="none"/>
</svg>
