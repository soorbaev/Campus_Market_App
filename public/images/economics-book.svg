<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="200" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6B892"/>
      <stop offset="100%" stop-color="#B99364"/>
    </linearGradient>
    <linearGradient id="cover" x1="90" y1="70" x2="290" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Library window light -->
  <rect x="24" y="18" width="140" height="120" rx="8" fill="#F8FAFC" opacity="0.65"/>
  <rect x="180" y="18" width="140" height="120" rx="8" fill="#F8FAFC" opacity="0.5"/>
  <!-- Wooden library desk -->
  <path d="M0 190 L400 175 L400 300 L0 300 Z" fill="url(#desk)"/>
  <!-- Open notebook under textbook -->
  <rect x="55" y="205" width="290" height="75" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="200" y1="205" x2="200" y2="280" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="75" y1="225" x2="180" y2="225" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="240" x2="165" y2="240" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="225" x2="320" y2="225" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="240" x2="300" y2="240" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <!-- Textbook spine & pages -->
  <path d="M90 155 L295 138 L312 182 L108 202 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M85 88 L285 74 L305 142 L105 160 Z" fill="url(#cover)"/>
  <path d="M85 88 L105 160 L108 202 L88 128 Z" fill="#172554"/>
  <!-- Book title graphic -->
  <rect x="122" y="96" width="136" height="24" rx="4" fill="#FFFFFF" opacity="0.95" transform="rotate(-4 122 96)"/>
  <rect x="128" y="104" width="90" height="4" rx="2" fill="#1E3A8A" transform="rotate(-4 128 104)"/>
  <rect x="129" y="112" width="115" height="3" rx="1.5" fill="#2563EB" transform="rotate(-4 129 112)"/>
  <!-- Sticky note bookmarks -->
  <rect x="260" y="62" width="14" height="20" rx="2" fill="#10B981" transform="rotate(6 260 62)"/>
  <rect x="242" y="65" width="14" height="18" rx="2" fill="#F59E0B" transform="rotate(4 242 65)"/>
  <!-- Blue ballpoint pen -->
  <rect x="135" y="232" width="115" height="7" rx="3.5" fill="#2563EB" transform="rotate(-8 135 232)"/>
  <polygon points="248,216 260,218 250,223" fill="#1E293B"/>
</svg>
